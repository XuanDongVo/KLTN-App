spring.application.name=EnglishApp_Server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Config Hibernate/JPA
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.curriculum.bootstrap.enabled=true
app.curriculum.bootstrap.locations=classpath:curriculum/starters-v4/manifest.json,classpath:curriculum/movers-v1/manifest.json,classpath:curriculum/flyers-v1/manifest.json
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Config MongoDB
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.representation.uuid=standard


#Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}


#JWT Token
jwt.secret=${JWT_SECRET}

#AI Model
ai.caption-service-url=${AI_MODEL_URL}

#CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.address=0.0.0.0
server.port=8080
#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from-address=itsnguyenbichloan2004@gmail.com
app.mail.from-name=EnglishApp