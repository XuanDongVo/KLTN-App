spring.application.name=EnglishApp_Server
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/englishapp?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/englishapp}
spring.mongodb.representation.uuid=standard

cloudinary.name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.secret=${CLOUDINARY_SECRET:}

jwt.secret=${JWT_SECRET:replace-this-with-a-secure-local-secret-at-least-32-bytes}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# Leave empty to use the development mock caption adapter.
ai.caption-service-url=${AI_CAPTION_SERVICE_URL:}

# Kept only on the server. Never expose this value in EXPO_PUBLIC_* variables.
gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.transcription-model=${GEMINI_TRANSCRIPTION_MODEL:gemini-3.6-flash}

# Bootstrap all reviewed packages only when the curriculum database is empty.
app.curriculum.bootstrap.enabled=${CURRICULUM_BOOTSTRAP_ENABLED:true}
app.curriculum.bootstrap.locations=classpath:curriculum/starters-v4/manifest.json,classpath:curriculum/movers-v1/manifest.json,classpath:curriculum/flyers-v1/manifest.json
